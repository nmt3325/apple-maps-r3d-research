<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R3D explorer</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#eef4f4;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none}#viewport{position:absolute;inset:0}.panel{position:absolute;left:22px;top:22px;width:300px;padding:20px;background:#101c28ec;border:1px solid #ffffff24;border-radius:16px;box-shadow:0 10px 45px #0005;backdrop-filter:blur(12px)}h1{font-size:20px;margin:0 0 6px;line-height:1.35}.small{font-size:12px;color:#acbcc9;line-height:1.7}hr{border:0;border-top:1px solid #ffffff20;margin:16px 0}.row{display:flex;align-items:center;justify-content:space-between;margin:12px 0;gap:12px}input{accent-color:#5cdcc4}input[type=checkbox]{width:18px;height:18px}input[type=range]{width:100%}button{font:inherit;color:#eef4f4;border:1px solid #ffffff35;border-radius:9px;background:#243849;padding:10px 13px;cursor:pointer}button.active{background:#197561;border-color:#5cdcc4}.buttons{display:flex;gap:8px}#status{position:absolute;bottom:20px;left:22px;padding:10px 14px;background:#101c28e6;border-radius:9px;max-width:calc(100vw - 44px)}#lockHint{margin-top:10px;color:#7de6d0}#error{color:#ffc5a8;white-space:pre-wrap}a{color:#8aebd6}details{margin-top:16px}summary{cursor:pointer;font-size:12px;color:#acbcc9}@media(max-width:650px){.panel{left:12px;top:12px;width:245px;padding:15px;font-size:12px}h1{font-size:17px}#status{left:12px;bottom:12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body><div id="viewport"></div>
<aside class="panel"><h1 id="title">R3D explorer</h1><div class="small" id="location"></div><div class="small" id="counts">読み込み中…</div><hr>
<label class="row"><span>元のテクスチャ付きポリゴン</span><input id="polygons" type="checkbox" checked></label>
<label class="row"><span>Splat</span><input id="splats" type="checkbox" checked></label>
<div class="buttons"><button id="fly" type="button">自由移動 OFF</button><button id="reset" type="button">全体表示</button></div>
<div class="small" id="lockHint">ドラッグで回転 · ホイールでズーム</div>
<label class="row" for="speed"><span>移動速度</span><span id="speedValue">15 m/s</span></label><input id="speed" type="range" min="2" max="150" step="1" value="15">
<div class="small">WASD 移動 · E / Q 上下 · Shift 高速<br>自由移動中は画面クリックでマウス視点操作<br>Esc マウス解除 · F 自由移動切替</div>
<details><summary>Splatの表示調整</summary><label class="row" for="opacity"><span>濃さ</span><span id="opacityValue">81</span></label><input id="opacity" type="range" min="0" max="120" step="1" value="81"><div class="small">Splatの合成は近似です。公式表示とのpixel一致、LOD、タイル累積・色変換は未検証。</div></details>
<div id="error" class="small"></div></aside><div id="status">データ読み込み中…</div>
<script type="module" src="./app.js"></script></body></html>
