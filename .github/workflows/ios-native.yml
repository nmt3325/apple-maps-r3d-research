name: iOS native build
on:
  workflow_dispatch:
  pull_request:
    paths: ['ios/**', 'codec/**', '.github/workflows/ios-native.yml']
  push:
    paths: ['ios/**', 'codec/**', '.github/workflows/ios-native.yml']
jobs:
  native:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare pinned embedded runtime
        run: bash ios/Scripts/bootstrap.sh
      - name: Check camera, LOD partition, and height discovery
        run: |
          swiftc ios/App/World.swift ios/Tests/WorldChecks.swift -o "$RUNNER_TEMP/world-checks"
          "$RUNNER_TEMP/world-checks"
          swiftc ios/App/World.swift ios/App/CameraNavigation.swift ios/Tests/NavigationChecks.swift -o "$RUNNER_TEMP/navigation-checks"
          "$RUNNER_TEMP/navigation-checks"
          swiftc ios/App/PipelineSlots.swift ios/Tests/PipelineChecks.swift -o "$RUNNER_TEMP/pipeline-checks"
          "$RUNNER_TEMP/pipeline-checks"
      - name: Check atlas refinement and resident mip reduction
        run: |
          swiftc ios/App/World.swift ios/App/GPUFactory.swift ios/Tests/GPUChecks.swift -o "$RUNNER_TEMP/gpu-checks"
          "$RUNNER_TEMP/gpu-checks"
      - name: Check decoder rejection and size bounds
        run: python ios/Tests/test_mobile_decoder.py -v
      - name: Build simulator
        run: >-
          xcodebuild -project ios/R3DExplorer.xcodeproj -scheme R3DExplorer
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/SimulatorBuild"
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone arm64
        run: >-
          xcodebuild -project ios/R3DExplorer.xcodeproj -scheme R3DExplorer
          -configuration Release -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DeviceBuild"
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DeviceBuild/Build/Products/Release-iphoneos/R3DExplorer.app"
          python ios/Scripts/package_unsigned_ipa.py "$app" "$RUNNER_TEMP/ipa-output/R3DExplorer-unsigned.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/ipa-output/R3DExplorer-unsigned.ipa" >> "$GITHUB_ENV"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: R3DExplorer-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30
